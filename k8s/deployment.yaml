apiVersion: apps/v1
kind: Deployment
metadata:
  name: btc-forecast
spec:
  replicas: 3
  selector:
    matchLabels:
      app: btc-forecast
  template:
    metadata:
      labels:
        app: btc-forecast
    spec:
      containers:
        - name: api
          image: minahilmir05/btc-mlops-api:latest
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: btc-config
            - secretRef:
                name: btc-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: models
              mountPath: /app/models
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: btc-models-pvc